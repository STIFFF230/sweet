<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4FA9C2">
<meta name="description" content="Una aventura para Sweet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sweet">
<title>Sweet</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" href="./assets/icons/favicon.png">
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>
<main id="app" aria-busy="true"><p>Cargando tu aventura…</p></main>
<p id="notice" role="status" aria-live="polite"></p>
<section id="map-overlay" hidden role="dialog" aria-modal="true" aria-label="Mapa de la aventura"><img id="map-image" alt="Mapa de la aventura"><output id="countdown" aria-label="Tiempo restante"></output><button id="close-map" hidden>Volver al camino</button></section>
<noscript>Activa JavaScript para abrir tu aventura.</noscript>
</body>
</html>
